name: Bug report
description: Report reproducible incorrect behavior in jeep-sqlite.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use the private reporting link in SECURITY.md.
        If the same problem reproduces on upstream `jeep-sqlite@2.8.0`, please also say so: it may belong upstream.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable code sample, the SQL involved, and the exact commands.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "jeep-sqlite-current-sqljs, sql.js, browser, Node.js, package manager, and operating system."
      placeholder: "jeep-sqlite-current-sqljs 2.9.0; sql.js 1.14.1; Chrome 154; Node 26; pnpm 12; macOS 26"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add console output, stack traces, or other useful details.
